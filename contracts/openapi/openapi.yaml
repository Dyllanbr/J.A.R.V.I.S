tags:
  - name: Operations
    description: Endpoints operacionais, sem regras de negócio.
  - name: Transactions
    description: Registro e consulta de despesas e receitas; nunca execução de movimentação financeira.
  - name: Categories
    description: Descoberta read-only do catálogo de classificação financeira do sistema.
  - name: Recurrences
    description: Compromissos mensais manuais; nunca fatos ocorridos nem criação automática de transactions.
  - name: Recurrence Suggestions
    description: Inferências determinísticas efêmeras que somente o usuário pode levar ao fluxo de Recurrence.
  - name: Cards
    description: Metadados organizacionais de cartões; nunca credenciais, compras, faturas ou pagamentos.
  - name: Card Purchases
    description: Compras de cartão já ocorridas, registradas como Expense e opcionalmente um InstallmentPlan.
  - name: Installment Plans
    description: Compromissos parcelados derivados de uma compra confirmada; não são parcelas financeiras independentes.
