openapi: 3.1.0
info:
  title: J.A.R.V.I.S. API
  version: 0.10.0
  description: >-
    API da fundação e dos incrementos financeiros de despesas, receitas,
    categorias, recorrências manuais, sugestões determinísticas e referências organizacionais de cartões. Criar uma transaction registra no
    organizador J.A.R.V.I.S. uma movimentação que já ocorreu no mundo real. Uma
    recurrence representa somente um compromisso ou expectativa futura e nunca
    cria uma Expense ou Income automaticamente. Nenhuma operação executa
    pagamento, Pix, transferência bancária, compra, recebimento ou movimentação
    de fundos. Os endpoints financeiros só existem quando o modo single-owner
    temporário está explicitamente habilitado.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:8080
    description: Execução local com a configuração padrão
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Verifica se o processo HTTP está operacional
      tags: [Operations]
      responses:
        "200":
          description: Processo operacional
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          description: Método não permitido
  /v1/transactions/preview:
    post:
      operationId: previewTransaction
      summary: Valida uma despesa ou receita para revisão antes da confirmação
      description: >-
        Despacha explicitamente por type e normaliza uma Expense ou Income sem
        gerar ID, gravar transaction, criar audit event ou reservar idempotência.
        O cliente deve apresentar este preview ao usuário antes de chamar a
        operação mutável.
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
            examples:
              expense:
                value:
                  type: EXPENSE
                  description: Mercado sintético
                  amount:
                    minor: 4250
                    currency: BRL
                  paymentMethod: PIX
                  categoryId: expense.food
                  occurredAt: "2026-08-14T15:00:00Z"
              income:
                value:
                  type: INCOME
                  description: Salário sintético
                  amount:
                    minor: 725000
                    currency: BRL
                  categoryId: income.salary
                  occurredAt: "2026-08-14T15:00:00Z"
      responses:
        "200":
          description: Representação canônica pronta para revisão
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPreview"
        "400":
          $ref: "#/components/responses/TransactionPreviewBadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/categories:
    get:
      operationId: listCategories
      summary: Lista o catálogo de categorias financeiras do sistema
      description: >-
        Retorna primeiro as categorias aplicáveis a Expense e depois as
        categorias aplicáveis a Income, em ordem estável do catálogo. A opção
        conceitual Sem categoria é representada pela ausência de categoryId em
        uma transaction e não integra esta lista.
      tags: [Categories]
      responses:
        "200":
          description: Catálogo completo e ordenado de categorias do sistema
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCatalogResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/cards/preview:
    post:
      operationId: previewCreditCard
      summary: Valida metadados organizacionais de um cartão antes da confirmação
      description: >-
        Normaliza somente metadados não sensíveis, sem gerar ID, consultar Clock,
        persistir dados ou executar compra, pagamento ou movimentação financeira.
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditCardCreateRequest"
      responses:
        "200":
          description: Representação canônica pronta para revisão
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardPreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/cards:
    post:
      operationId: recordCreditCard
      summary: Registra uma referência organizacional de cartão confirmada pelo usuário
      description: >-
        Cria somente metadados ACTIVE. Não aceita PAN completo, credencial ou
        token e não autoriza compra ou pagamento. Replay retorna o snapshot
        histórico original mesmo depois de o cartão ser arquivado.
      tags: [Cards]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditCardCreateRequest"
      responses:
        "201":
          description: Cartão criado ou replay histórico do resultado original
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCard"
        "400":
          $ref: "#/components/responses/CreditCardCreateBadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listCreditCards
      summary: Lista as referências de cartão do owner
      description: >-
        Retorna ACTIVE antes de ARCHIVED em ordem determinística. Não aceita
        filtros, não calcula fatura, limite disponível, saldo ou projeção.
      tags: [Cards]
      responses:
        "200":
          description: Lista owner-scoped; items nunca é null
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/cards/{cardId}:
    get:
      operationId: getCreditCard
      summary: Consulta uma referência de cartão do owner
      tags: [Cards]
      parameters:
        - name: cardId
          in: path
          required: true
          description: Identificador opaco do cartão.
          schema:
            $ref: "#/components/schemas/CreditCardId"
      responses:
        "200":
          description: Referência de cartão encontrada
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCard"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/CreditCardNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/cards/{cardId}/archive:
    post:
      operationId: archiveCreditCard
      summary: Arquiva terminalmente uma referência de cartão do owner
      description: >-
        Executa somente ACTIVE para ARCHIVED, sem aceitar body e sem apagar o
        cartão. Recurso inexistente e recurso de outro owner são indistinguíveis.
      tags: [Cards]
      parameters:
        - name: cardId
          in: path
          required: true
          description: Identificador opaco do cartão.
          schema:
            $ref: "#/components/schemas/CreditCardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cartão arquivado ou replay do arquivamento original
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCard"
        "400":
          $ref: "#/components/responses/CreditCardArchiveBadRequest"
        "404":
          $ref: "#/components/responses/CreditCardNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/CreditCardArchiveConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credit-cards/{creditCardId}/statements/{statementDueOn}:
    get:
      operationId: getCreditCardStatement
      summary: Consulta o statement mínimo de um cartão em uma data de vencimento
      description: >-
        Retorna uma projeção somente leitura do ciclo do cartão para a data civil
        informada. Inclui compras à vista e somente a parcela correspondente de
        compras parceladas. Não inclui recorrências, não cria Expenses futuras e
        não executa pagamentos ou baixa financeira.
      tags: [Cards]
      parameters:
        - name: creditCardId
          in: path
          required: true
          description: Identificador opaco do cartão.
          schema:
            $ref: "#/components/schemas/CreditCardId"
        - name: statementDueOn
          in: path
          required: true
          description: Data civil de vencimento do ciclo consultado.
          schema:
            $ref: "#/components/schemas/CivilDate"
      responses:
        "200":
          description: Statement do ciclo, que pode estar vazio.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/CreditCardNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/recurrences/preview:
    post:
      operationId: previewRecurrence
      summary: Valida uma recorrência mensal de despesa antes da confirmação
      description: >-
        Normaliza uma recorrência manual sem gerar ID, consultar Clock, persistir
        dados, criar audit ou reservar idempotência. Recurrence é uma expectativa
        futura separada de Expense e Income e este endpoint não cria transaction.
      tags: [Recurrences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrenceRequest"
            example:
              type: EXPENSE
              description: Academia sintética
              expectedAmount:
                minor: 11900
                currency: BRL
              frequency: MONTHLY
              startsOn: "2026-09-10"
      responses:
        "200":
          description: Representação canônica pronta para revisão
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrencePreview"
        "400":
          $ref: "#/components/responses/RecurrencePreviewBadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/recurrences:
    post:
      operationId: recordRecurrence
      summary: Registra uma recorrência mensal de despesa confirmada pelo usuário
      description: >-
        Cria um compromisso futuro ACTIVE, sem criar Expense, Income ou qualquer
        transaction. Retry com a mesma chave e semântica retorna o snapshot
        original da criação, mesmo que a recorrência tenha sido cancelada depois.
      tags: [Recurrences]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrenceRequest"
            example:
              type: EXPENSE
              description: Academia sintética
              expectedAmount:
                minor: 11900
                currency: BRL
              frequency: MONTHLY
              startsOn: "2026-09-10"
      responses:
        "201":
          description: Recorrência criada ou replay histórico do resultado original
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recurrence"
        "400":
          $ref: "#/components/responses/RecurrenceCreateBadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listRecurrences
      summary: Lista as recorrências do owner
      description: >-
        Retorna recorrências ACTIVE antes de CANCELLED, em ordem determinística.
        Não aceita filtros, não calcula próxima ocorrência, total, orçamento ou
        projeção e nunca consulta ou cria transactions.
      tags: [Recurrences]
      responses:
        "200":
          description: Lista owner-scoped, com array vazio quando não há recorrências
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrenceList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/recurrences/{recurrenceId}/cancel:
    post:
      operationId: cancelRecurrence
      summary: Cancela terminalmente uma recorrência do owner
      description: >-
        Executa somente ACTIVE para CANCELLED e atribui cancelledAt no servidor.
        O comando não aceita body, não apaga a recorrência e não cria ou altera
        Expense, Income ou transaction. Recurso inexistente e recurso de outro
        owner produzem a mesma resposta.
      tags: [Recurrences]
      parameters:
        - name: recurrenceId
          in: path
          required: true
          description: Identificador opaco da recorrência.
          schema:
            $ref: "#/components/schemas/RecurrenceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Recorrência cancelada ou replay do cancelamento original
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recurrence"
        "400":
          $ref: "#/components/responses/RecurrenceCancelBadRequest"
        "404":
          $ref: "#/components/responses/RecurrenceNotFound"
        "409":
          $ref: "#/components/responses/RecurrenceCancelConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/recurrence-suggestions:
    get:
      operationId: listRecurrenceSuggestions
      summary: Lista possíveis recorrências de despesa inferidas deterministicamente
      description: >-
        Deriva sugestões efêmeras a partir de Expenses do owner e evidências
        atuais. Não persiste sugestões, não cria Recurrence e não altera fatos
        financeiros. Não aceita filtros nem owner fornecido pelo cliente.
      tags: [Recurrence Suggestions]
      responses:
        "200":
          description: Sugestões atuais em ordem determinística; items nunca é null
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrenceSuggestionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/recurrence-suggestions/{suggestionId}/dismiss:
    post:
      operationId: dismissRecurrenceSuggestion
      summary: Rejeita idempotentemente uma sugestão atual
      description: >-
        Persiste somente a suppression owner-scoped da evidência atual. Não
        aceita body e não altera Expense, Income, Category ou Recurrence.
      tags: [Recurrence Suggestions]
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: Identificador opaco e determinístico da sugestão atual.
          schema:
            $ref: "#/components/schemas/RecurrenceSuggestionId"
      responses:
        "204":
          description: Sugestão rejeitada ou replay da mesma decisão
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/RecurrenceSuggestionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/recurrence-suggestions/{suggestionId}/preview:
    post:
      operationId: previewSuggestedRecurrence
      summary: Prepara uma sugestão atual para revisão como Recurrence
      description: >-
        Recalcula a sugestão pelo ID e reutiliza o preview canônico de Recurrence
        com dados derivados no servidor. Não aceita body, não persiste Recurrence
        e não causa qualquer escrita financeira.
      tags: [Recurrence Suggestions]
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: Identificador opaco e determinístico da sugestão atual.
          schema:
            $ref: "#/components/schemas/RecurrenceSuggestionId"
      responses:
        "200":
          description: Recurrence canônica pronta para Review, ainda não confirmada
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrencePreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/RecurrenceSuggestionNotFound"
        "409":
          $ref: "#/components/responses/RecurrenceSuggestionSuppressed"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/card-purchases/preview:
    post:
      operationId: previewCardPurchase
      summary: Prepara uma compra de cartão para revisão
      tags: [Card Purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardPurchasePreviewRequest"
      responses:
        "200":
          description: Compra canônica pronta para revisão, sem persistência
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPurchasePreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/CreditCardNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/CreditCardArchived"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/card-purchases:
    post:
      operationId: recordCardPurchase
      summary: Registra uma compra de cartão confirmada
      tags: [Card Purchases]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardPurchaseCreateRequest"
      responses:
        "201":
          description: Compra registrada ou replay do snapshot histórico
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPurchase"
        "400":
          $ref: "#/components/responses/CardPurchaseCreateBadRequest"
        "404":
          $ref: "#/components/responses/CreditCardNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/CardPurchaseConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/installment-plans:
    get:
      operationId: listInstallmentPlans
      summary: Lista compromissos parcelados do owner
      tags: [Installment Plans]
      responses:
        "200":
          description: Lista determinística de planos
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlanListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/installment-plans/{installmentPlanId}:
    get:
      operationId: getInstallmentPlan
      summary: Consulta um plano de parcelas do owner
      tags: [Installment Plans]
      parameters:
        - $ref: "#/components/parameters/InstallmentPlanId"
      responses:
        "200":
          description: Plano de parcelas
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InstallmentPlanNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/installment-plans/{installmentPlanId}/cancellation-preview:
    post:
      operationId: previewInstallmentPlanCancellation
      summary: Prepara o cancelamento de um plano para revisão
      tags: [Installment Plans]
      parameters:
        - $ref: "#/components/parameters/InstallmentPlanId"
      responses:
        "200":
          description: Cancelamento pronto para revisão, sem persistência
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlanCancellationPreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InstallmentPlanNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/InstallmentPlanAlreadyCancelled"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/installment-plans/{installmentPlanId}/cancel:
    post:
      operationId: cancelInstallmentPlan
      summary: Cancela um plano de parcelas confirmado
      tags: [Installment Plans]
      parameters:
        - $ref: "#/components/parameters/InstallmentPlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallmentPlanCancelRequest"
      responses:
        "200":
          description: Plano cancelado ou replay do cancelamento
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InstallmentPlanNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/InstallmentPlanConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/scheduled-commitments:
    get:
      operationId: listScheduledCommitments
      summary: Lista compromissos futuros derivados de fontes confirmadas
      description: >-
        Retorna uma projeção somente leitura e determinística de parcelas de
        InstallmentPlan e ocorrências mensais de Recurrence dentro do horizonte
        civil aprovado. A operação não cria Expenses futuras, não persiste a
        projeção e não executa pagamentos.
      tags: [Installment Plans]
      parameters:
        - name: evaluationDate
          in: query
          required: true
          description: Data civil usada como início exclusivo da projeção.
          schema:
            $ref: "#/components/schemas/CivilDate"
      responses:
        "200":
          description: Linhas projetadas em ordem determinística; a lista pode ser vazia.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledCommitmentListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/transactions:
    post:
      operationId: recordTransaction
      summary: Registra uma despesa ou receita já confirmada pelo canal
      description: >-
        Registra no organizador uma despesa ou receita já ocorrida e confirmada
        pelo usuário no canal chamador. Esta operação não executa pagamento,
        recebimento, Pix, transferência, compra nem movimentação bancária. O
        owner é o contexto single-owner temporário do servidor; origin IOS e
        timezone financeira America/Sao_Paulo também são atribuídos pelo
        servidor. Retry com a mesma chave, operação e semântica retorna o recurso
        original sem novas gravações.
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
            examples:
              expense:
                value:
                  type: EXPENSE
                  description: Mercado sintético
                  amount:
                    minor: 4250
                    currency: BRL
                  paymentMethod: PIX
                  categoryId: expense.food
                  occurredAt: "2026-08-14T15:00:00Z"
              income:
                value:
                  type: INCOME
                  description: Salário sintético
                  amount:
                    minor: 725000
                    currency: BRL
                  categoryId: income.salary
                  occurredAt: "2026-08-14T15:00:00Z"
      responses:
        "201":
          description: Movimentação registrada ou replay seguro do recurso original
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              description: Presente com valor true somente quando a resposta é replay.
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/TransactionCreateBadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listTransactionsByMonth
      summary: Lista despesas e receitas do owner no mês financeiro informado
      description: >-
        Usa limites de calendário em America/Sao_Paulo e consulta o intervalo
        [início do mês, início do próximo mês). Não calcula total, saldo,
        orçamento ou resumo.
      tags: [Transactions]
      parameters:
        - name: month
          in: query
          required: true
          description: Mês financeiro estrito no formato YYYY-MM.
          schema:
            type: string
            pattern: "^(?!0000-)[0-9]{4}-(0[1-9]|1[0-2])$"
          example: "2026-08"
      responses:
        "200":
          description: Lista mista determinística, vazia quando não há movimentações
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionMonth"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    CacheControl:
      required: true
      description: Impede armazenamento da resposta.
      schema:
        type: string
        const: no-store
    ContentTypeOptions:
      required: true
      description: Impede MIME sniffing da resposta.
      schema:
        type: string
        const: nosniff
    IdempotencyReplayed:
      description: Presente com valor true somente quando a resposta é replay.
      schema:
        type: string
        const: "true"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Chave opaca de 1 a 128 bytes ASCII visíveis, escopada por owner e pela
        operação lógica. CREATE_EXPENSE, CREATE_INCOME, CREATE_RECURRENCE,
        CANCEL_RECURRENCE, CREATE_CREDIT_CARD, ARCHIVE_CREDIT_CARD,
        CREATE_CARD_PURCHASE e CANCEL_INSTALLMENT_PLAN possuem
        namespaces independentes. A mesma string pode
        ser usada em operações ou owners diferentes sem colisão. O valor nunca é
        devolvido em erros ou responses.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[!-~]+$"
      example: synthetic-create-20260814-001
    InstallmentPlanId:
      name: installmentPlanId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/InstallmentPlanId"
  responses:
    InvalidRequest:
      description: Request inválido
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequestError"
    TransactionPreviewBadRequest:
      description: Request ou tipo de transaction inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionPreviewBadRequestError"
    TransactionCreateBadRequest:
      description: Request, tipo de transaction ou chave de idempotência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionCreateBadRequestError"
    RecurrencePreviewBadRequest:
      description: Request ou tipo de recorrência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecurrencePreviewBadRequestError"
    RecurrenceCreateBadRequest:
      description: Request, tipo de recorrência ou chave de idempotência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecurrenceCreateBadRequestError"
    RecurrenceCancelBadRequest:
      description: Request, identificador ou chave de idempotência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecurrenceCancelBadRequestError"
    CreditCardCreateBadRequest:
      description: Request ou chave de idempotência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreditCardCreateBadRequestError"
    CreditCardArchiveBadRequest:
      description: Request, identificador ou chave de idempotência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreditCardArchiveBadRequestError"
    IdempotencyConflict:
      description: Chave reutilizada com semântica diferente
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IdempotencyConflictError"
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: idempotency key was reused with a different request
    RecurrenceCancelConflict:
      description: Chave reutilizada com semântica diferente ou recorrência já cancelada
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecurrenceCancelConflictError"
    RecurrenceNotFound:
      description: Recorrência inexistente ou fora do escopo do owner
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecurrenceNotFoundError"
          example:
            error:
              code: RECURRENCE_NOT_FOUND
              message: recurrence was not found
    CreditCardNotFound:
      description: Cartão inexistente ou fora do escopo do owner
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreditCardNotFoundError"
    CreditCardArchiveConflict:
      description: Chave reutilizada com semântica diferente ou cartão já arquivado
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreditCardArchiveConflictError"
    CreditCardArchived:
      description: Cartão arquivado não aceita novas compras
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreditCardArchivedError"
    CardPurchaseCreateBadRequest:
      description: Request ou chave de idempotência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CardPurchaseCreateBadRequestError"
    CardPurchaseConflict:
      description: Chave reutilizada com semântica diferente ou cartão arquivado
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CardPurchaseConflictError"
    InstallmentPlanNotFound:
      description: Plano inexistente ou fora do escopo do owner
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstallmentPlanNotFoundError"
    InstallmentPlanAlreadyCancelled:
      description: Plano já cancelado
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstallmentPlanAlreadyCancelledError"
    InstallmentPlanConflict:
      description: Conflito de idempotência ou confirmação obsoleta
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstallmentPlanConflictError"
    RecurrenceSuggestionNotFound:
      description: Sugestão inexistente, stale ou fora do escopo do owner
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecurrenceSuggestionNotFoundError"
    RecurrenceSuggestionSuppressed:
      description: Sugestão rejeitada e indisponível para preview
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecurrenceSuggestionSuppressedError"
    MethodNotAllowed:
      description: Método não permitido para a rota financeira
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodNotAllowedError"
    InternalError:
      description: Falha interna sem exposição de detalhes técnicos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Money:
      type: object
      additionalProperties: false
      required: [minor, currency]
      properties:
        minor:
          type: integer
          format: int64
          minimum: 1
          description: Valor BRL exato em centavos; nunca float ou decimal.
          example: 4250
        currency:
          type: string
          const: BRL
    CivilDate:
      type: string
      format: date
      pattern: "^(?!0000-)[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      description: Data civil gregoriana em YYYY-MM-DD, sem horário, timezone ou offset.
      examples: ["2024-02-29", "2026-04-30", "2026-08-31"]
    CreditCardId:
      type: string
      pattern: "^card_[0-9a-f]{32}$"
      description: Identificador opaco de 128 bits gerado pelo servidor.
    CreditCardBrand:
      type: string
      enum: [VISA, MASTERCARD, ELO, AMERICAN_EXPRESS, HIPERCARD, OTHER]
    CreditCardStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    CreditCardCreateRequest:
      type: object
      additionalProperties: false
      required: [name, closingDay, dueDay]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        lastFour:
          type: string
          pattern: "^[0-9]{4}$"
          description: Sufixo opcional para identificação visual; nunca PAN completo.
        brand:
          $ref: "#/components/schemas/CreditCardBrand"
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
        creditLimit:
          $ref: "#/components/schemas/Money"
    CreditCardPreview:
      type: object
      additionalProperties: false
      required: [name, closingDay, dueDay]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        lastFour:
          type: string
          pattern: "^[0-9]{4}$"
        brand:
          $ref: "#/components/schemas/CreditCardBrand"
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
        creditLimit:
          $ref: "#/components/schemas/Money"
    CreditCard:
      type: object
      additionalProperties: false
      required: [id, name, closingDay, dueDay, status, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/CreditCardId"
        name:
          type: string
          minLength: 1
          maxLength: 200
        lastFour:
          type: string
          pattern: "^[0-9]{4}$"
        brand:
          $ref: "#/components/schemas/CreditCardBrand"
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
        creditLimit:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/CreditCardStatus"
        createdAt:
          type: string
          format: date-time
          description: Instante UTC atribuído pelo servidor com precisão máxima de microssegundos.
        archivedAt:
          type: string
          format: date-time
          description: Presente somente em status ARCHIVED e preservado em replay.
    CreditCardListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreditCard"
    CardStatement:
      type: object
      additionalProperties: false
      required: [creditCardId, statementDueOn, totalAmount, lines]
      properties:
        creditCardId:
          $ref: "#/components/schemas/CreditCardId"
        statementDueOn:
          $ref: "#/components/schemas/CivilDate"
        totalAmount:
          $ref: "#/components/schemas/CardStatementTotalAmount"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CardStatementLine"
    CardStatementTotalAmount:
      type: object
      additionalProperties: false
      required: [minor, currency]
      properties:
        minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          const: BRL
    CardStatementLine:
      type: object
      additionalProperties: false
      required: [expenseId, description, amount, occurredAt, purchaseMode]
      properties:
        expenseId:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          $ref: "#/components/schemas/CivilDate"
        purchaseMode:
          $ref: "#/components/schemas/CardPurchaseMode"
        installmentNumber:
          type: integer
          minimum: 1
        installmentCount:
          type: integer
          minimum: 2
          maximum: 120
    InstallmentPlanId:
      type: string
      pattern: "^ipl_[0-9a-f]{32}$"
      description: Identificador opaco de um plano de parcelas gerado pelo servidor.
    CardPurchaseMode:
      type: string
      enum: [ONE_TIME, INSTALLMENT]
    CardPurchasePreviewRequest:
      type: object
      additionalProperties: false
      required: [description, amount, occurredAt, creditCardId]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        creditCardId:
          $ref: "#/components/schemas/CreditCardId"
        installmentCount:
          type: integer
          minimum: 2
          maximum: 120
    CardPurchaseCreateRequest:
      type: object
      additionalProperties: false
      required: [description, amount, occurredAt, creditCardId]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        creditCardId:
          $ref: "#/components/schemas/CreditCardId"
        installmentCount:
          type: integer
          minimum: 2
          maximum: 120
    Installment:
      type: object
      additionalProperties: false
      required: [number, totalCount, dueDate, amount]
      properties:
        number:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 2
          maximum: 120
        dueDate:
          $ref: "#/components/schemas/CivilDate"
        amount:
          $ref: "#/components/schemas/Money"
    ScheduledCommitmentSource:
      type: string
      enum: [INSTALLMENT_PLAN, RECURRENCE]
    ScheduledCommitment:
      type: object
      additionalProperties: false
      required: [source, sourceId, sequence, dueOn, amount]
      properties:
        source:
          $ref: "#/components/schemas/ScheduledCommitmentSource"
        sourceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[!-~]+$"
          description: Identificador opaco da fonte confirmada.
        sequence:
          type: integer
          minimum: 1
        dueOn:
          $ref: "#/components/schemas/CivilDate"
        amount:
          $ref: "#/components/schemas/Money"
    ScheduledCommitmentListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledCommitment"
    InstallmentSummary:
      type: object
      additionalProperties: false
      required: [installmentCount, firstDueDate, lastDueDate, dueDayAnchor, regularInstallmentAmount, lastInstallmentAmount]
      properties:
        installmentCount:
          type: integer
          minimum: 2
          maximum: 120
        firstDueDate:
          $ref: "#/components/schemas/CivilDate"
        lastDueDate:
          $ref: "#/components/schemas/CivilDate"
        dueDayAnchor:
          type: integer
          minimum: 1
          maximum: 31
        regularInstallmentAmount:
          $ref: "#/components/schemas/Money"
        lastInstallmentAmount:
          $ref: "#/components/schemas/Money"
    CardPurchasePreview:
      type: object
      additionalProperties: false
      required: [description, amount, occurredAt, creditCardId, purchaseMode, statementClosingOn, statementDueOn]
      properties:
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        creditCardId:
          $ref: "#/components/schemas/CreditCardId"
        purchaseMode:
          $ref: "#/components/schemas/CardPurchaseMode"
        statementClosingOn:
          $ref: "#/components/schemas/CivilDate"
        statementDueOn:
          $ref: "#/components/schemas/CivilDate"
        installmentSummary:
          $ref: "#/components/schemas/InstallmentSummary"
    CardPurchaseExpense:
      type: object
      additionalProperties: false
      required: [id, type, description, amount, paymentMethod, creditCardId, statementDueOn, occurredAt, financialTimezone, origin, status, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          const: EXPENSE
