openapi: 3.1.0
info:
  title: J.A.R.V.I.S. API
  version: 0.4.0
  description: >-
    API da fundação e dos incrementos financeiros de despesas e receitas. Criar
    uma transaction registra no organizador J.A.R.V.I.S. uma movimentação que já
    ocorreu no mundo real; não executa pagamento, Pix, transferência bancária,
    compra, recebimento ou qualquer movimentação de fundos. Os endpoints
    financeiros só existem quando o modo single-owner temporário está
    explicitamente habilitado.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:8080
    description: Execução local com a configuração padrão
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Verifica se o processo HTTP está operacional
      tags: [Operations]
      responses:
        "200":
          description: Processo operacional
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          description: Método não permitido
  /v1/transactions/preview:
    post:
      operationId: previewTransaction
      summary: Valida uma despesa ou receita para revisão antes da confirmação
      description: >-
        Despacha explicitamente por type e normaliza uma Expense ou Income sem
        gerar ID, gravar transaction, criar audit event ou reservar idempotência.
        O cliente deve apresentar este preview ao usuário antes de chamar a
        operação mutável.
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
            examples:
              expense:
                value:
                  type: EXPENSE
                  description: Mercado sintético
                  amount:
                    minor: 4250
                    currency: BRL
                  paymentMethod: PIX
                  categoryId: expense.food
                  occurredAt: "2026-08-14T15:00:00Z"
              income:
                value:
                  type: INCOME
                  description: Salário sintético
                  amount:
                    minor: 725000
                    currency: BRL
                  categoryId: income.salary
                  occurredAt: "2026-08-14T15:00:00Z"
      responses:
        "200":
          description: Representação canônica pronta para revisão
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/categories:
    get:
      operationId: listCategories
      summary: Lista o catálogo de categorias financeiras do sistema
      description: >-
        Retorna primeiro as categorias aplicáveis a Expense e depois as
        categorias aplicáveis a Income, em ordem estável do catálogo. A opção
        conceitual Sem categoria é representada pela ausência de categoryId em
        uma transaction e não integra esta lista.
      tags: [Categories]
      responses:
        "200":
          description: Catálogo completo e ordenado de categorias do sistema
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCatalogResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/transactions:
    post:
      operationId: recordTransaction
      summary: Registra uma despesa ou receita já confirmada pelo canal
      description: >-
        Registra no organizador uma despesa ou receita já ocorrida e confirmada
        pelo usuário no canal chamador. Esta operação não executa pagamento,
        recebimento, Pix, transferência, compra nem movimentação bancária. O
        owner é o contexto single-owner temporário do servidor; origin IOS e
        timezone financeira America/Sao_Paulo também são atribuídos pelo
        servidor. Retry com a mesma chave, operação e semântica retorna o recurso
        original sem novas gravações.
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
            examples:
              expense:
                value:
                  type: EXPENSE
                  description: Mercado sintético
                  amount:
                    minor: 4250
                    currency: BRL
                  paymentMethod: PIX
                  categoryId: expense.food
                  occurredAt: "2026-08-14T15:00:00Z"
              income:
                value:
                  type: INCOME
                  description: Salário sintético
                  amount:
                    minor: 725000
                    currency: BRL
                  categoryId: income.salary
                  occurredAt: "2026-08-14T15:00:00Z"
      responses:
        "201":
          description: Movimentação registrada ou replay seguro do recurso original
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Idempotency-Replayed:
              description: Presente com valor true somente quando a resposta é replay.
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listTransactionsByMonth
      summary: Lista despesas e receitas do owner no mês financeiro informado
      description: >-
        Usa limites de calendário em America/Sao_Paulo e consulta o intervalo
        [início do mês, início do próximo mês). Não calcula total, saldo,
        orçamento ou resumo.
      tags: [Transactions]
      parameters:
        - name: month
          in: query
          required: true
          description: Mês financeiro estrito no formato YYYY-MM.
          schema:
            type: string
            pattern: "^(?!0000-)[0-9]{4}-(0[1-9]|1[0-2])$"
          example: "2026-08"
      responses:
        "200":
          description: Lista mista determinística, vazia quando não há movimentações
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionMonth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    CacheControl:
      required: true
      description: Impede armazenamento da resposta.
      schema:
        type: string
        const: no-store
    ContentTypeOptions:
      required: true
      description: Impede MIME sniffing da resposta.
      schema:
        type: string
        const: nosniff
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Chave opaca de 1 a 128 bytes ASCII visíveis, escopada por owner e pela
        operação CREATE_EXPENSE ou CREATE_INCOME derivada de type. A mesma string
        pode ser usada nas duas operações sem colisão. O valor nunca é devolvido
        em erros ou responses.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[!-~]+$"
      example: synthetic-create-20260814-001
  responses:
    BadRequest:
      description: Request, domínio ou chave de idempotência inválidos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Chave reutilizada com semântica diferente
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: idempotency key was reused with a different request
    MethodNotAllowed:
      description: Método não permitido para a rota financeira
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Falha interna sem exposição de detalhes técnicos
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Money:
      type: object
      additionalProperties: false
      required: [minor, currency]
      properties:
        minor:
          type: integer
          format: int64
          minimum: 1
          description: Valor BRL exato em centavos; nunca float ou decimal.
          example: 4250
        currency:
          type: string
          const: BRL
    CategoryId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9]*([._][a-z0-9]+)*$"
      description: >-
        Identidade técnica estável de uma categoria do sistema. O campo é
        omitido para uma transaction sem categoria e nunca aceita null.
    ExpenseRequest:
      type: object
      additionalProperties: false
      required: [type, description, amount, paymentMethod, occurredAt]
      properties:
        type:
          type: string
          const: EXPENSE
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          type: string
          enum: [PIX, DEBIT, CREDIT, CASH]
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        occurredAt:
          type: string
          format: date-time
          description: >-
            Instante normalizado para UTC e truncado para precisão de
            microssegundos antes de preview, fingerprint, persistência e resposta.
    IncomeRequest:
      type: object
      additionalProperties: false
      required: [type, description, amount, occurredAt]
      properties:
        type:
          type: string
          const: INCOME
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        occurredAt:
          type: string
          format: date-time
          description: >-
            Instante normalizado para UTC e truncado para precisão de
            microssegundos antes de preview, fingerprint, persistência e resposta.
    TransactionRequest:
      oneOf:
        - $ref: "#/components/schemas/ExpenseRequest"
        - $ref: "#/components/schemas/IncomeRequest"
      discriminator:
        propertyName: type
        mapping:
          EXPENSE: "#/components/schemas/ExpenseRequest"
          INCOME: "#/components/schemas/IncomeRequest"
    ExpensePreview:
      type: object
      additionalProperties: false
      required:
        - type
        - description
        - amount
        - paymentMethod
        - occurredAt
        - financialTimezone
        - origin
      properties:
        type:
          type: string
          const: EXPENSE
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          type: string
          enum: [PIX, DEBIT, CREDIT, CASH]
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        occurredAt:
          type: string
          format: date-time
          description: Instante canônico em UTC com precisão máxima de microssegundos.
        financialTimezone:
          type: string
          const: America/Sao_Paulo
        origin:
          type: string
          const: IOS
    IncomePreview:
      type: object
      additionalProperties: false
      required:
        - type
        - description
        - amount
        - occurredAt
        - financialTimezone
        - origin
      properties:
        type:
          type: string
          const: INCOME
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        occurredAt:
          type: string
          format: date-time
          description: Instante canônico em UTC com precisão máxima de microssegundos.
        financialTimezone:
          type: string
          const: America/Sao_Paulo
        origin:
          type: string
          const: IOS
    TransactionPreview:
      oneOf:
        - $ref: "#/components/schemas/ExpensePreview"
        - $ref: "#/components/schemas/IncomePreview"
      discriminator:
        propertyName: type
        mapping:
          EXPENSE: "#/components/schemas/ExpensePreview"
          INCOME: "#/components/schemas/IncomePreview"
    Expense:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - description
        - amount
        - paymentMethod
        - occurredAt
        - financialTimezone
        - origin
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          const: EXPENSE
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          type: string
          enum: [PIX, DEBIT, CREDIT, CASH]
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        occurredAt:
          type: string
          format: date-time
          description: Instante canônico em UTC com precisão máxima de microssegundos.
        financialTimezone:
          type: string
          const: America/Sao_Paulo
        origin:
          type: string
          const: IOS
        status:
          type: string
          const: RECORDED
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
          description: Instante gerado em UTC com precisão máxima de microssegundos.
        updatedAt:
          type: string
          format: date-time
          description: Instante gerado em UTC com precisão máxima de microssegundos.
    Income:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - description
        - amount
        - occurredAt
        - financialTimezone
        - origin
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          const: INCOME
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        occurredAt:
          type: string
          format: date-time
          description: Instante canônico em UTC com precisão máxima de microssegundos.
        financialTimezone:
          type: string
          const: America/Sao_Paulo
        origin:
          type: string
          const: IOS
        status:
          type: string
          const: RECORDED
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
          description: Instante gerado em UTC com precisão máxima de microssegundos.
        updatedAt:
          type: string
          format: date-time
          description: Instante gerado em UTC com precisão máxima de microssegundos.
    TransactionResponse:
      oneOf:
        - $ref: "#/components/schemas/Expense"
        - $ref: "#/components/schemas/Income"
      discriminator:
        propertyName: type
        mapping:
          EXPENSE: "#/components/schemas/Expense"
          INCOME: "#/components/schemas/Income"
    TransactionMonth:
      type: object
      additionalProperties: false
      required: [month, items]
      properties:
        month:
          type: string
          pattern: "^(?!0000-)[0-9]{4}-(0[1-9]|1[0-2])$"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponse"
    CategoryDefinitionResponse:
      type: object
      additionalProperties: false
      required: [id, type, displayName]
      properties:
        id:
          $ref: "#/components/schemas/CategoryId"
        type:
          type: string
          enum: [EXPENSE, INCOME]
          description: Tipo de transaction ao qual a categoria é aplicável.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nome de apresentação pt-BR fornecido pelo catálogo.
    CategoryCatalogResponse:
      type: array
      description: >-
        Catálogo de sistema ordenado por aplicabilidade e ordem interna; não
        inclui uma entrada para Sem categoria.
      items:
        $ref: "#/components/schemas/CategoryDefinitionResponse"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - UNSUPPORTED_TRANSACTION_TYPE
                - IDEMPOTENCY_KEY_REQUIRED
                - IDEMPOTENCY_KEY_INVALID
                - IDEMPOTENCY_KEY_REUSED
                - METHOD_NOT_ALLOWED
                - INTERNAL_ERROR
            message:
              type: string
tags:
  - name: Operations
    description: Endpoints operacionais, sem regras de negócio.
  - name: Transactions
    description: Registro e consulta de despesas e receitas; nunca execução de movimentação financeira.
  - name: Categories
    description: Descoberta read-only do catálogo de classificação financeira do sistema.
