name: jarvis

services:
  postgres:
    image: postgres:18.6@sha256:ae6c78831cbc35fa3a4aaf4d763ddacf6183d6004774cc2dc28b3920410d1d1a
    environment:
      POSTGRES_DB: ${JARVIS_POSTGRES_DB:?set JARVIS_POSTGRES_DB}
      POSTGRES_USER: ${JARVIS_POSTGRES_USER:?set JARVIS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JARVIS_POSTGRES_PASSWORD:?set JARVIS_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${JARVIS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s
    volumes:
      - jarvis-postgres-data:/var/lib/postgresql

volumes:
  jarvis-postgres-data:
